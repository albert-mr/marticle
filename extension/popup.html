<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Marticle</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/32.png" alt="">Marticle
    <a href="https://github.com/albert-mr/marticle" target="_blank" rel="noopener" title="Marticle on GitHub" aria-label="Marticle on GitHub">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
    </a>
  </header>
  <section id="card">
    <p class="eyebrow">X Article</p>
    <h1 id="title">Reading article…</h1>
    <p id="status" role="status" aria-live="polite"></p>
  </section>
  <div class="actions">
    <button id="copy" disabled>Copy as Markdown</button>
    <button id="save" disabled title="Save as .md file" aria-label="Save as .md file">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M2.75 14A1.75 1.75 0 0 1 1 12.25v-2.5a.75.75 0 0 1 1.5 0v2.5c0 .138.112.25.25.25h10.5a.25.25 0 0 0 .25-.25v-2.5a.75.75 0 0 1 1.5 0v2.5A1.75 1.75 0 0 1 13.25 14ZM7.25 7.689V2a.75.75 0 0 1 1.5 0v5.689l1.97-1.969a.75.75 0 1 1 1.06 1.06l-3.25 3.25a.75.75 0 0 1-1.06 0L4.22 6.78a.75.75 0 1 1 1.06-1.06l1.97 1.969Z"/></svg>
    </button>
    <button id="pdf" disabled title="Save as PDF" aria-label="Save as PDF">PDF</button>
  </div>
  <ul id="warnings" hidden></ul>
  <details>
    <summary>Preview</summary>
    <textarea id="preview" rows="10" readonly spellcheck="false" aria-label="Markdown"></textarea>
  </details>
  <script type="module" src="popup.js"></script>
</body>
</html>
