<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Marticle</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1 id="title">Reading article…</h1>
  <p id="status" role="status" aria-live="polite"></p>
  <button id="copy" disabled>Copy as Markdown</button>
  <ul id="warnings" hidden></ul>
  <details>
    <summary>Preview</summary>
    <textarea id="preview" rows="10" readonly spellcheck="false" aria-label="Markdown"></textarea>
  </details>
  <script type="module" src="popup.js"></script>
</body>
</html>
